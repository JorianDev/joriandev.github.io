<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertrouwen Politiek - JorianDev</title>
  <link rel="stylesheet" href="../styling/style.css">
  <link rel="icon" type="image/x-icon" href="../logo-website-github.png">

  <script src="../data/vertrouwendata.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>

<body>
  <header>
    <h1>Vertrouwen Politiek</h1>
  </header>

  <main>
    <button id="TerugBtn">
      <a href="../politiek/politics.html">Terug</a>
    </button>
    <p>Vertrouwen in politieke instituten. Data van het Centraal Bureau voor de Statistiek (<a href="https://www.cbs.nl/nl-nl/longread/statistische-trends/2026/vertrouwen-in-de-politiek-2016-2025/3-resultaten">CBS</a>).</p>

    <section class="chart-wrapper" style="height: 600px; max-height: 80vh;">
      <canvas id="vertrouwenChart" style="width: 100%; height: 100%; display: block;"></canvas>
    </section>

    <section class="data-table-section">
      <h2>Onderliggende data</h2>
      <div class="table-container">
        <table id="vertrouwenDataTable">
          <thead>
            <tr>
              <th>Jaar</th>
              <th>Gemeenteraad</th>
              <th>Europese Unie</th>
              <th>Ambtenaren</th>
              <th>Tweede Kamer</th>
              <th>Politici</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script defer>
    const categorieData = [
      { key: "gemeenteraad", label: "Gemeenteraad", color: "#4e79a7" },
      { key: "europeseUnie", label: "Europese Unie", color: "#f28e2b" },
      { key: "ambtenaren", label: "Ambtenaren", color: "#e15759" },
      { key: "tweedeKamer", label: "Tweede Kamer", color: "#76b7b2" },
      { key: "politici", label: "Politici", color: "#59a14f" },
    ];

    function buildChartData() {
      return categorieData.map(category => ({
        label: category.label,
        data: politiekVertrouwenData.data.map(item => item[category.key]),
        borderColor: category.color,
        backgroundColor: category.color + '33',
        tension: 0.25,
        spanGaps: true,
        pointRadius: 4,
        pointHoverRadius: 7,
      }));
    }

    function updateChart(chart) {
      chart.data.datasets = buildChartData();
      chart.update();
    }

    function renderDataTable() {
      const tbody = document.querySelector('#vertrouwenDataTable tbody');
      tbody.innerHTML = '';

      politiekVertrouwenData.data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.date}</td>
          <td>${item.gemeenteraad !== null ? item.gemeenteraad : ''}</td>
          <td>${item.europeseUnie !== null ? item.europeseUnie : ''}</td>
          <td>${item.ambtenaren !== null ? item.ambtenaren : ''}</td>
          <td>${item.tweedeKamer !== null ? item.tweedeKamer : ''}</td>
          <td>${item.politici !== null ? item.politici : ''}</td>
        `;
        tbody.appendChild(row);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const ctx = document.getElementById('vertrouwenChart').getContext('2d');
      const labels = politiekVertrouwenData.data.map(item => item.date);
      const config = {
        type: 'line',
        data: {
          labels,
          datasets: buildChartData(),
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'top',
            },
            title: {
              display: true,
              text: 'Politiek vertrouwen per instituut',
            },
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              title: {
                display: true,
                text: 'Vertrouwen (% van 15-plussers)',
              },
            },
            x: {
              title: {
                display: true,
                text: 'Jaar',
              },
            },
          },
        },
      };

      const vertrouwenChart = new Chart(ctx, config);
      renderDataTable();
    });
  </script>
</body>
